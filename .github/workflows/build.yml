name: Build Android APK

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and upload APK
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename Release APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CompassCorrector.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompassCorrector
          path: app/build/outputs/apk/release/CompassCorrector.apk

      - name: Delete Old Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep last 3 runs
          runs=$(gh run list --workflow build.yml --json databaseId --jq '.[].databaseId' || echo "")

          count=0
          for run in $runs; do
            count=$((count+1))
            if [ $count -gt 3 ]; then
              gh run delete $run
            fi
          done
